name = "portfolio-analytics"
main = "analytics-worker.js"
compatibility_date = "2024-09-23"

# Served from the account's workers.dev subdomain. Preview URLs are off: this is
# a data endpoint, and per-version preview hostnames would multiply the surface
# that has to stay inside the CORS allowlist for no benefit here.
workers_dev = true
preview_urls = false

# Created 2026-08-04 via `wrangler d1 create portfolio-analytics --location wnam`.
# `wrangler dev --local` / `d1 execute --local` still use a local SQLite file and
# never touch this database; only `--remote` and deploys do.
[[d1_databases]]
binding = "DB"
database_name = "portfolio-analytics"
database_id = "1461dcfc-e4ba-4a11-a9ce-81bc711b9323"

[vars]
# "true" only for local dev — accepts events posted from a localhost origin.
# Leave unset (or "false") in production.
ANALYTICS_ALLOW_LOCAL = "false"

# Secrets (never put real values here — set via `wrangler secret put <NAME>`):
#   ADMIN_PASSWORD   dashboard password, plaintext compare server-side
#   HASH_SALT        pepper for the daily-rotating visitor hash
